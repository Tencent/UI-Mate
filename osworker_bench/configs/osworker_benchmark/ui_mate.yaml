# Default OSWorker Benchmark configuration (UI-Mate PromptV2)
# Usage:
#   MOCK_APP_BASE_URL=http://<mock-host> bash scripts/osworker_benchmark/start_osworker_benchmark_test.sh
#
# Design notes:
#   * The task suite is defined by evaluation_examples/OSWorker/osworker_benchmark_full.json
#     and contains 100 cases.
#   * Each task's reward and setup files are read from osworker_cache/<task_id>/.
#   * MOCK_APP_BASE_URL points to the separately deployed mock backend.
#   * vLLM downloads tencent/UI-Mate-27B from Hugging Face on first launch.
#     MODEL_PATH may override it with another repository ID or local checkpoint.

environment:
  provider_name: docker
  region: us-east-1
  headless: true
  screen_width: 1920
  screen_height: 1080
  os_type: Ubuntu
  client_password: password
  enable_proxy: false
  cache_dir: osworker_cache

agent:
  name: ui_mate_promptv2
  model: UI_Mate
  model_path: tencent/UI-Mate-27B
  action_space: pyautogui
  observation_type: screenshot
  max_tokens: 65536
  temperature: 1.0
  top_p: 0.95
  max_trajectory_length: 200
  extra:
    prompt_type: l2
    history_n: 200
    coordinate_type: relative
    api_backend: openai
    enable_thinking: true
    include_observation_in_history: false
    # recent_think_steps takes effect only when include_thinking_in_history=true
    include_thinking_in_history: true
    images_to_keep: 5
    # recent_think_steps=null disables truncation, preserving all <think> blocks in the history
    recent_think_steps: null
    # When collapsing history, also retain the first image (step0); the launcher sets
    # --limit-mm-per-prompt to images_to_keep+1
    keep_first_image: true

run:
  mode: test
  max_steps: 200
  num_envs: 10
  sleep_after_execution: 5.0
  settle_wait: 20.0
  record_video: true
  empty_actions_break: true
  test_all_meta_path: evaluation_examples/OSWorker/osworker_benchmark_full.json
  test_config_base_dir: evaluation_examples/OSWorker
  result_dir: ./results_our_benchmark
  log_level: INFO

vllm:
  tensor_parallel_size: 2
  data_parallel_size: 1
  pipeline_parallel_size: 1
  port: 8081
  max_model_len: 65536
  extra_args: "--revision 3ade2378fc84032d5017c1a9c93c4eaa77d65e57 --gpu-memory-utilization 0.85 --mm-encoder-tp-mode data"
